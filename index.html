<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f5f5f7">
<title>Jack's Week</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;background:#f5f5f7;color:#111;min-height:100vh}
.app{max-width:560px;margin:auto;padding:18px 16px 92px}.top{display:flex;justify-content:space-between;align-items:center;margin:6px 2px 18px}.brand{font-size:28px;font-weight:800;letter-spacing:-.04em}.sub{color:#666;font-size:13px}.pill{border:1px solid #d9d9d9;background:#fff;border-radius:999px;padding:9px 12px;font-size:20px}.view{display:none}.view.active{display:block}.hero{background:#111;color:#fff;border-radius:24px;padding:22px;margin-bottom:14px}.hero h1{margin:0 0 6px;font-size:25px}.hero p{margin:0;color:#d8d8d8}.progress{margin-top:12px;height:10px;background:rgba(255,255,255,.12);border-radius:999px;overflow:hidden}.bar{height:100%;background:#fff;border-radius:999px}.card{background:#fff;border:1px solid #e8e8e8;border-radius:20px;padding:16px;margin:10px 0}.sectiontitle{font-size:19px;font-weight:800;margin:22px 3px 8px}.task{display:flex;gap:13px;align-items:center;padding:9px 2px;border-radius:12px}.task:hover{background:#f7f7f7}.task.done .box{background:#111;border-color:#111}.task.done .txt{text-decoration:line-through;color:#666}.box{width:18px;height:18px;border-radius:6px;border:2px solid #cfcfcf;flex-shrink:0;background:#fff}.txt{font-size:15px;line-height:1.35}.days{display:flex;gap:7px;overflow:auto;padding-bottom:3px}.daybtn{border:0;background:#fff;border:1px solid #e8e8e8;border-radius:14px;padding:10px 12px;font-weight:700;white-space:nowrap}.daybtn.active{background:#111;color:#fff}.nav{position:fixed;bottom:0;left:0;right:0;background:rgba(250,250,250,.94);backdrop-filter:blur(14px);border-top:1px solid #ddd;z-index:5}.navin{max-width:560px;margin:auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0}.nav button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:10px 4px 12px;color:#444;font-size:12px;font-weight:600}.nav button.active{color:#111}.nav button.active .ico{background:#111;color:#fff}.ico{width:22px;height:22px;border-radius:7px;background:#e9e9e9;display:grid;place-items:center}.stat{display:flex;justify-content:space-between;align-items:center}.big{font-size:42px;font-weight:850;letter-spacing:-2px}.smallmuted{color:#888;font-size:13px}.row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #f0f0f0}.row:last-child{border-bottom:none}button{font-family:inherit;cursor:pointer}.action{width:100%;border:0;border-radius:14px;padding:13px;background:#111;color:#fff;font-weight:800;margin-top:8px}.secondary{background:#f1f1f1;color:#111}.action + .action{margin-top:10px}input,textarea,select{width:100%;padding:12px;border:1px solid #ddd;border-radius:12px;font:inherit;margin:5px 0 9px}.empty{color:#888;text-align:center;padding:25px 10px}.back{border:0;background:#f4f4f4;border-radius:12px;padding:10px 12px;font-weight:700}p{margin:0}.small{font-size:13px}.muted{color:#666}.intro{font-size:14px;line-height:1.55;color:#555}</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div><div class="brand">Jack's Week</div><div class="sub" id="dateSub"></div></div>
    <button class="pill" onclick="showView('more')">☰</button>
  </div>

  <section id="today" class="view active"></section>
  <section id="week" class="view"></section>
  <section id="progress" class="view"></section>
  <section id="micra" class="view"></section>
  <section id="career" class="view"></section>
  <section id="more" class="view"></section>
</div>

<nav class="nav"><div class="navin">
<button onclick="showView('today')" data-v="today"><span class="ico">✓</span>Today</button>
<button onclick="showView('week')" data-v="week"><span class="ico">▦</span>Week</button>
<button onclick="showView('progress')" data-v="progress"><span class="ico">◔</span>Progress</button>
<button onclick="showView('micra')" data-v="micra"><span class="ico">🚗</span>Micra</button>
<button onclick="showView('career')" data-v="career"><span class="ico">⌁</span>Career</button>
</div></nav>

<script>
const days=["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
const categories=["Career","Work","Girlfriend","Money","Health","Micra","Life"];
const weekTasks=[
["Monday","Call CAVC about CAD course","Career",true],["Monday","Message work about punctuality / situation","Work",true],["Monday","Date with girlfriend","Girlfriend",false],["Monday","Eat a proper meal and rest","Health",false],["Monday","One focused CAD session","Career",false],
["Tuesday","Girlfriend hospital appointment","Girlfriend",true],["Tuesday","Look after girlfriend afterwards","Girlfriend",true],["Tuesday","Easy food and rest","Health",false],["Tuesday","Only light Micra admin","Micra",false],["Tuesday","Apply for 1–2 jobs","Career",true],
["Wednesday","Apply for 1–2 suitable jobs","Career",true],["Wednesday","Follow up CAVC / enrolment","Career",true],["Wednesday","CAD learning / practice","Career",false],["Wednesday","Keep evening low-stress","Life",false],["Wednesday","Review money basics","Money",true],
["Thursday","Apply for 1–2 suitable jobs","Career",true],["Thursday","Sort one important money task","Money",true],["Thursday","Light fitness / recovery","Health",false],["Thursday","Progress on Micra list","Micra",false],["Thursday","Plan next steps","Life",true],
["Friday","Apply for 1–2 suitable jobs","Career",true],["Friday","CAD learning / portfolio practice","Career",false],["Friday","Food / rest / social balance","Health",false],["Friday","Micra admin only","Micra",false],["Friday","Catch up on life admin","Life",true],
["Saturday","Girlfriend / family time","Girlfriend",false],["Saturday","Light Micra planning only","Micra",false],["Saturday","Healthy food / recovery","Health",false],["Saturday","Low pressure and rest","Life",false],["Saturday","Small career admin","Career",false],
["Sunday","Review finances","Money",true],["Sunday","Plan next week","Life",true],["Sunday","CAD / career review","Career",false],["Sunday","Reset and prepare for week ahead","Health",true]
];

const micra={
"Mechanical & reliability":["Full mechanical refresh","MOT / roadworthiness sorted","Fix boot floor / spare-wheel well dent properly","Get boot closing and latching correctly","Fix heavy-rain water ingress","Investigate starter and weird electrical faults","Keep everything road-safe and reliable"],
"Body & restoration":["Repair / replace cracked rear bumper","Sort loose boot handle","Repair scratches / bush damage","Check front door hinge areas and clean leaves/debris","Keep car rust-free","Deep clean underside","Refinish / protect bodywork sensibly"],
"Interior & boot build":["Finish flat rear boot build","Add carpet / clean OEM+ finish","Make two rear storage hatches","Keep spare-wheel access hatchable","Plan lightweight tool storage","Add practical boot lighting","Peg the boot layout for usable storage"],
"Performance / OEM+":["Confirm 1.3 cams are genuinely correct before fitting","Install 1.3 cams if verified and appropriate","Paint rocker cover OEM+","Plan K&N version of GizFab-style intake","Add protective mesh behind the grille","Keep the project realistic and useful"],
"Cleaning & detailing":["Full exterior clean / decontamination","Deep interior clean","Clean door shuts and hinge areas","Clean engine bay carefully","Detail wheels","Use drill attachment detailing kit","Organise storage and supplies"],
"Future ideas":["Research stronger engine swap options if 1.0 eventually dies","Research 1.3 / larger Micra engine routes","Explore turbo + ITB possibilities as a long-term project only","Keep overall build OEM+ and driveable"]};

const career={
"Immediate stability":["Protect current income while possible","Secure a backup job ASAP","Update CV","Apply for 5–10 genuinely suitable jobs each week","Use plumbing experience as a backup route","Keep finances stable while exploring options"],
"CAVC / CAD":["Contact CAVC and confirm CAD course details","Get enrolled on the CAD course","Confirm course day / time","Tell work about the fixed course commitment once enrolled","Use CAVC computers initially if needed"],
"CAD skills":["Learn 2D CAD fundamentals","Practise technical drawing standards","Build confidence with dimensions / layers / layouts","Learn construction drawing conventions","Progress toward 3D CAD","Learn a easier CAD workflow that suits the role"],
"Portfolio & career":["Build a small CAD portfolio","Create a few clean house-plan / construction drawing projects","Keep examples of plumbing knowledge as an advantage","Research CAD technician / architectural technician roles","Keep a professional-looking example set"],
"Longer-term setup":["Save for a good home CAD computer","Buy a suitable monitor when affordable","Build a proper home CAD workspace","Move from care into CAD/design when income is stable","Keep developing portfolio and confidence"]};

let state=JSON.parse(localStorage.getItem("jacksWeekState")||"{}");
state.week=state.week||{}; state.micra=state.micra||{}; state.career=state.career||{};
let selectedDay=days[Math.max(0,new Date().getDay()-1)]||"Monday";

function save(){localStorage.setItem("jacksWeekState",JSON.stringify(state))}
function key(type,section,item){return type+"|"+section+"|"+item}
function done(type,section,item){return !!state[type][key(type,section,item)]}
function toggle(type,section,item){let k=key(type,section,item);state[type][k]=!state[type][k];save();renderAll()}
function taskHTML(type,section,item){
 return `<div class="task ${done(type,section,item)?'done':''}" onclick="toggle('${type}','${esc(section)}','${esc(item)}')"><div class="box"></div><div><div class="txt">${item}</div></div></div>`
}
function esc(s){return s.replaceAll("\\","\\\\").replaceAll("'","\\'")}
function allWeek(){return weekTasks.length}
function weekDone(){return weekTasks.filter(x=>state.week[x[0]+"|"+x[1]]).length}
function progressForDay(d){let a=weekTasks.filter(x=>x[0]===d),n=a.filter(x=>state.week[x[0]+"|"+x[1]]).length;return [n,a.length]}
function renderToday(){
 let [n,total]=progressForDay(selectedDay), tasks=weekTasks.filter(x=>x[0]===selectedDay);
 document.getElementById("today").innerHTML=`<div class="days">${days.map(d=>`<button class="daybtn ${d===selectedDay?'active':''}" onclick="selectedDay='${d}';renderAll()">${d.slice(0,3)}</button>`).join("")}</div>
 <div class="hero"><h1>${selectedDay}</h1><p>${n} of ${total} tasks complete</p><div class="progress"><div class="bar" style="width:${total?n/total*100:0}%"></div></div></div>
 <div class="card">${tasks.length?tasks.map(x=>`<div class="task ${state.week[x[0]+"|"+x[1]]?'done':''}" onclick="toggleWeek('${esc(x[0])}','${esc(x[1])}')"><div class="box"></div><div><div class="txt">${x[1]}</div></div></div>`).join(""):`<div class="empty">No tasks for this day.</div>`}</div>`
}
function toggleWeek(d,t){let k=d+"|"+t;state.week[k]=!state.week[k];save();renderAll()}
function renderWeek(){
 document.getElementById("week").innerHTML=`<div class="hero"><h1>This Week</h1><p>${weekDone()} of ${allWeek()} complete</p><div class="progress"><div class="bar" style="width:${weekDone()/allWeek()*100}%"></div></div></div>
 <div class="card">${weekTasks.map(x=>`<div class="task ${state.week[x[0]+"|"+x[1]]?'done':''}" onclick="toggleWeek('${esc(x[0])}','${esc(x[1])}')"><div class="box"></div><div><div class="txt">${x[0]} — ${x[1]}</div></div></div>`).join("")}</div>`
}
function renderProgress(){
 let total=weekTasks.length,n=weekDone();
 let cats=categories.map(c=>{let a=weekTasks.filter(x=>x[2]===c),d=a.filter(x=>state.week[x[0]+"|"+x[1]]).length;return `<div class="row"><span>${c}</span><b>${d}/${a.length||0}</b></div>`}).join("");
 document.getElementById("progress").innerHTML=`<div class="hero"><div class="smallmuted">Weekly completion</div><div class="big">${Math.round(n/total*100)}%</div><p>${n} of ${total} complete</p><div class="progress"><div class="bar" style="width:${n/total*100}%"></div></div></div>
 <div class="card">${cats}</div>`
}
function renderLong(type,data,title,icon){
 let sections=Object.entries(data).map(([s,items])=>`<div class="sectiontitle">${s}</div><div class="card">${items.map(i=>taskHTML(type,s,i)).join("")}</div>`).join("");
 document.getElementById(type).innerHTML=`<div class="hero"><h1>${icon} ${title}</h1><p>Long-term list — no deadlines. Tick things off when they are actually done.</p></div>${sections}<button class="action" onclick="addLongTask('${type}')">Add task</button>`
}
function addLongTask(type){
 let t=prompt("What do you want to add?");
 if(!t)return; let s=prompt("Which section?")||"Other";
 let data=type==="micra"?micra:career;if(!data[s])data[s]=[];data[s].push(t);save();renderAll();
}
function renderMore(){
 document.getElementById("more").innerHTML=`<div class="hero"><h1>More</h1><p>Your planner, long-term projects and reset tools.</p></div>
 <div class="card"><div class="sectiontitle" style="margin-top:0">Planning rule</div><p class="smallmuted">Weekly tasks are for things you intend to do now. Micra and Career are long-term lists with no deadlines — tick only when genuinely done.</p></div>
 <div class="card"><button class="action" onclick="resetWeek()">Start a New Week</button><button class="action secondary" onclick="clearLong('micra')">Reset Micra ticks</button><button class="action secondary" onclick="clearLong('career')">Reset Career ticks</button></div>`
}
function resetWeek(){if(confirm("Clear this week's completed tasks?")){state.week={};save();renderAll()}}
function clearLong(type){if(confirm("Clear all completed ticks in this section?")){state[type]={};save();renderAll()}}
function showView(v){document.querySelectorAll(".view").forEach(x=>x.classList.remove("active"));document.getElementById(v).classList.add("active");document.querySelectorAll(".nav button").forEach(x=>x.classList.toggle("active",x.dataset.v===v))}
function renderAll(){renderToday();renderWeek();renderProgress();renderLong("micra",micra,"Micra","🚗");renderLong("career",career,"Career Plan","💼");renderMore()}
document.getElementById("dateSub").textContent=new Date().toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"});
renderAll();showView("today");
</script>
</body>
</html>
